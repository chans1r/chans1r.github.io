<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>宇宙尋寶探險：25的神秘星系</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            /* 讓背景固定，即使畫面往下滑動背景也不會跟著跑 */
            background: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2048&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        .bg-overlay {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-animation {
            animation: shake 0.5s ease-in-out;
            background-color: #ef4444 !important; 
            color: #ffffff !important;
            border-color: #b91c1c !important;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }

        .game-btn {
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.4);
        }
        .game-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }

        .sortable-ghost { opacity: 0.3; }
        
        /* 防止拖拉物件觸發螢幕滑動 */
        .drag-item {
            touch-action: none; 
            cursor: grab;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drag-item:active { cursor: grabbing; }

        .empty-slot {
            width: 70px;
            height: 70px;
            border: 3px dashed rgba(255,255,255,0.7);
            border-radius: 1rem;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        @media (min-width: 768px) {
            .empty-slot { width: 85px; height: 85px; }
        }
        
        .drag-wrapper {
            width: 70px;
            height: 70px;
        }
        @media (min-width: 768px) {
            .drag-wrapper { width: 85px; height: 85px; }
        }
    </style>
</head>
<!-- 改為 min-h-screen 允許畫面內容過多時自然產生上下滑動 -->
<body class="min-h-[100dvh] w-screen flex flex-col relative overflow-x-hidden overflow-y-auto">
    <div class="bg-overlay"></div>

    <!-- ================= 錯誤提示 Toast ================= -->
    <div id="error-toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 -translate-y-24 opacity-0 transition-all duration-300 bg-red-500 text-white px-6 py-3 md:px-8 md:py-4 rounded-full text-lg md:text-2xl font-bold shadow-2xl z-50 border-4 border-red-300 pointer-events-none whitespace-nowrap">
        🙈 哎呀！差一點點，再試一次喔！
    </div>

    <!-- ================= 遊戲主要容器 (Flex-1 充滿空間) ================= -->
    <div class="flex-1 flex flex-col w-full max-w-5xl mx-auto p-4 z-10 relative">
        
        <!-- ================= 1. 開始畫面 ================= -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center w-full h-full py-10">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Math&backgroundColor=transparent" alt="Robot" class="w-32 h-32 md:w-48 md:h-48 floating drop-shadow-2xl mb-4">
            <h1 class="text-4xl md:text-6xl font-black mb-4 text-yellow-300 drop-shadow-lg text-center tracking-wide leading-tight">
                宇宙尋寶探險<br><span class="text-3xl md:text-5xl text-white">25的神秘星系</span>
            </h1>
            <p class="text-xl md:text-2xl mb-8 font-bold bg-black/40 px-6 py-3 rounded-full shadow-lg border border-white/20 text-center">
                完成 9 個任務，開啟神秘寶箱！
            </p>
            <button onclick="startGame()" class="game-btn bg-green-400 hover:bg-green-500 text-green-900 text-3xl md:text-4xl font-black py-4 px-12 rounded-full border-4 border-white mt-4">
                開始探險 🚀
            </button>
        </div>

        <!-- ================= 2. 遊戲畫面 ================= -->
        <div id="game-screen" class="hidden flex-col w-full h-full pt-2 md:pt-4">
            
            <div class="flex items-center justify-between mb-3 bg-black/50 p-3 rounded-2xl border border-white/20 shadow-lg">
                <div class="text-2xl font-bold text-yellow-300 ml-2">
                    ⭐ 第 <span id="progress-text">1/9</span> 題
                </div>
                <div class="text-xl md:text-2xl font-bold text-white mr-2 flex items-center gap-2">
                    ⏱️ <span id="time-text">00:00</span>
                </div>
            </div>

            <div class="flex flex-col items-center w-full mb-3">
                <div class="glass-card text-blue-900 p-4 rounded-3xl text-center border-4 border-blue-300 w-full mb-3 shadow-lg">
                    <h2 id="question-text" class="text-2xl md:text-4xl font-black leading-snug">題目讀取中...</h2>
                </div>
                
                <button onclick="toggleHint()" id="hint-btn" class="game-btn bg-yellow-400 text-yellow-900 rounded-full px-6 py-2 text-lg md:text-xl font-bold border-4 border-white shadow-lg flex items-center justify-center gap-2 animate-pulse hover:bg-yellow-300">
                    💡 點我看小提示
                </button>
                
                <div id="hint-box" class="hidden w-full max-w-2xl bg-white text-blue-900 p-4 rounded-2xl shadow-xl border-4 border-yellow-400 mt-3 text-lg md:text-xl font-bold text-left relative">
                    <button onclick="toggleHint()" class="absolute top-2 right-3 text-gray-400 text-3xl hover:text-red-500">✖</button>
                    <div id="hint-text" class="pr-8">提示內容...</div>
                </div>
            </div>

            <div id="interaction-area" class="flex-1 flex flex-col justify-start md:justify-center items-center w-full pb-4">
                <!-- 題型 1: 拖拉排列區 -->
                <div id="level1-container" class="hidden w-full flex-col items-center">
                    <div id="track-container" class="w-full flex flex-wrap justify-center items-center gap-2 md:gap-3 bg-indigo-900/60 p-3 md:p-4 rounded-3xl border-2 border-indigo-300 shadow-inner">
                    </div>
                    
                    <div class="text-base md:text-xl font-bold text-yellow-300 my-4 bg-black/40 px-5 py-2 rounded-full border border-white/20 text-center">
                        ⬇️ 請將下方數字，拖放到正確的空格中 ⬇️
                    </div>
                    
                    <div class="w-full flex flex-wrap justify-center gap-2 md:gap-3 p-2 bg-black/20 rounded-2xl min-h-[90px]" id="drag-pool">
                    </div>
                </div>

                <!-- 題型 2 & 3: 選擇題區 -->
                <div id="mcq-container" class="hidden w-full grid grid-cols-2 gap-4 md:gap-6 mt-2">
                </div>
            </div>

            <!-- 答對時的特效重疊層 -->
            <div id="success-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
                <div id="success-message" class="text-4xl md:text-7xl font-black text-center p-8 glass-card rounded-3xl shadow-2xl transform transition-transform scale-0 text-yellow-500 border-8 border-yellow-400">
                    ✨ 太棒了！ ✨<br><span class="text-3xl text-green-600 mt-2 block">完全正確！</span>
                </div>
            </div>
        </div>

        <!-- ================= 3. 結算畫面 ================= -->
        <div id="result-screen" class="hidden flex-1 flex-col items-center justify-center w-full h-full py-8 text-center z-20">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Party&backgroundColor=transparent" class="w-28 h-28 md:w-40 md:h-40 floating drop-shadow-2xl mb-4">
            
            <h2 class="text-5xl md:text-6xl font-black mb-2 text-white drop-shadow-lg" id="result-title">結算中...</h2>
            <div id="medal-icon" class="text-7xl md:text-[8rem] mb-2 floating drop-shadow-2xl">🎁</div>
            <p class="text-2xl md:text-3xl font-bold mb-6 text-yellow-300 bg-black/50 px-6 py-2 rounded-full" id="result-subtitle">太棒了！</p>
            
            <div class="glass-card p-5 md:p-6 rounded-3xl border-2 border-white/40 text-left text-lg md:text-2xl font-bold space-y-3 mb-4 text-blue-900 shadow-xl">
                <p>⏱️ 花費時間：<span id="stat-time" class="text-blue-700"></span></p>
                <p>❌ 答錯次數：<span id="stat-mistakes" class="text-red-500"></span> 次</p>
                <p>💡 尋求提示：<span id="stat-hints" class="text-orange-500"></span> 次</p>
            </div>

            <p class="text-lg md:text-2xl font-black mb-6 text-green-300 drop-shadow-md bg-black/40 px-6 py-3 rounded-full border border-green-400/50">
                💡 多練習，知識才會更深刻喔！💪
            </p>

            <button onclick="resetGame()" class="game-btn bg-blue-500 hover:bg-blue-600 text-white text-3xl font-black py-4 px-12 rounded-full border-4 border-white mt-2">
                再次挑戰 🚀
            </button>
        </div>
    </div>

    <!-- ================= 頁尾：製作人資訊 ================= -->
    <div class="w-full text-center pb-4 pt-2 text-white/70 text-sm md:text-base font-bold z-10 mt-auto tracking-widest drop-shadow-md">
        製作人: 陳沅昊老師
    </div>

    <!-- ================= JavaScript 邏輯 ================= -->
    <script>
        const totalQuestions = 9;
        let currentQuestionIdx = 0; 
        let mistakes = 0; 
        let mistakesOnCurrent = 0; 
        let hintsUsed = 0;
        
        let timeElapsed = 0; 
        let timerInterval = null;
        
        const GOLD_TIME_LIMIT = 180; 
        const SILVER_TIME_LIMIT = 240;

        let uniqueLevel1Configs = [];
        let uniqueLevel2Multipliers = [];
        let uniqueLevel3Combos = [];
        let sortableInstances = [];
        let currentCorrectAnswer = null;

        // Fisher-Yates 洗牌演算法，保證絕對隨機
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            // 每次開始自動滾動到最頂部
            window.scrollTo(0, 0);
            
            currentQuestionIdx = 0;
            mistakes = 0;
            hintsUsed = 0;
            timeElapsed = 0;
            
            // --- 預先產生絕不重複的題庫 ---
            let l1Pool = [];
            for(let mult=3; mult<=8; mult++) {
                l1Pool.push({ startMult: mult, isAscending: true });
                l1Pool.push({ startMult: mult, isAscending: false });
            }
            uniqueLevel1Configs = shuffleArray(l1Pool).slice(0, 3);

            let mPool = [3, 4, 5, 6, 7, 8, 9];
            uniqueLevel2Multipliers = shuffleArray(mPool).slice(0, 3);

            let cPool = [];
            const base = [20, 25, 50, 100];
            for(let i=0; i<base.length; i++) {
                for(let j=0; j<base.length; j++) {
                    if(i !== j) cPool.push({a: base[i], b: base[j]});
                }
            }
            uniqueLevel3Combos = shuffleArray(cPool).slice(0, 3);

            updateTimerDisplay();
            startTimer();
            loadNextQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            let m = Math.floor(timeElapsed / 60).toString().padStart(2, '0');
            let s = (timeElapsed % 60).toString().padStart(2, '0');
            document.getElementById('time-text').innerText = `${m}:${s}`;
        }

        function loadNextQuestion() {
            if (currentQuestionIdx >= totalQuestions) {
                endGame();
                return;
            }

            mistakesOnCurrent = 0;
            hideHint();
            document.getElementById('progress-text').innerText = `${currentQuestionIdx + 1}/${totalQuestions}`;
            
            document.getElementById('level1-container').classList.add('hidden');
            document.getElementById('mcq-container').classList.add('hidden');

            if (currentQuestionIdx < 3) {
                generateLevel1(); 
            } else if (currentQuestionIdx < 6) {
                generateLevel2(); 
            } else {
                generateLevel3(); 
            }
        }

        // ========== 第一關：拖拉排列 ==========
        function generateLevel1() {
            document.getElementById('level1-container').classList.remove('hidden');
            document.getElementById('level1-container').classList.add('flex');
            
            const config = uniqueLevel1Configs[currentQuestionIdx];
            const isAscending = config.isAscending;
            const startMult = config.startMult;
            
            let fullSeq = [];
            for(let i=0; i<6; i++) {
                fullSeq.push(isAscending ? (startMult + i) * 25 : (startMult + 5 - i) * 25);
            }
            
            let indices = shuffleArray([0, 1, 2, 3, 4, 5]);
            let missingIndices = indices.slice(0, 3);
            
            let correctAnswers = missingIndices.map(idx => fullSeq[idx]);
            
            let possibleDistractors = [];
            for(let i=1; i<=15; i++) {
                if(!fullSeq.includes(i*25)) possibleDistractors.push(i*25);
            }
            possibleDistractors = shuffleArray(possibleDistractors);
            let distractors = possibleDistractors.slice(0, 3);
            
            let poolItems = shuffleArray([...correctAnswers, ...distractors]);

            document.getElementById('question-text').innerHTML = `🚀 軌道修理任務：<br><span class="text-red-600 font-black">以 25 個一數的方式依規律</span> 排上去！`;
            document.getElementById('hint-text').innerHTML = `💡 小秘密：<br>觀察看看數字是從大到小還是從小到大喔！<br>相鄰的數字都會相差 25！`;

            const trackContainer = document.getElementById('track-container');
            const poolContainer = document.getElementById('drag-pool');
            trackContainer.innerHTML = '';
            poolContainer.innerHTML = '';

            sortableInstances.forEach(inst => inst.destroy());
            sortableInstances = [];

            for(let i=0; i<6; i++) {
                if(missingIndices.includes(i)) {
                    const slot = document.createElement('div');
                    slot.className = 'empty-slot';
                    slot.dataset.expected = fullSeq[i];
                    trackContainer.appendChild(slot);
                    
                    let slotSortable = new Sortable(slot, {
                        group: {
                            name: 'shared',
                            put: function(to) { return to.el.querySelectorAll('.drag-wrapper').length === 0; }
                        },
                        animation: 150,
                        onAdd: checkLevel1Completion
                    });
                    sortableInstances.push(slotSortable);
                } else {
                    const fixedBlock = document.createElement('div');
                    fixedBlock.className = 'w-[70px] h-[70px] md:w-[85px] md:h-[85px] bg-orange-500 text-white text-2xl md:text-3xl font-black rounded-2xl flex items-center justify-center border-4 border-orange-200 shadow-md';
                    fixedBlock.innerText = fullSeq[i];
                    trackContainer.appendChild(fixedBlock);
                }
            }

            poolItems.forEach(num => {
                const wrapper = document.createElement('div');
                wrapper.className = 'drag-wrapper';
                
                const item = document.createElement('div');
                item.className = 'drag-item bg-blue-500 text-white text-2xl md:text-3xl font-black rounded-xl border-4 border-blue-300 shadow-lg';
                item.innerText = num;
                item.dataset.val = num;
                
                wrapper.appendChild(item);
                poolContainer.appendChild(wrapper);
            });

            let poolSortable = new Sortable(poolContainer, {
                group: 'shared',
                animation: 150
            });
            sortableInstances.push(poolSortable);
        }

        function checkLevel1Completion() {
            const emptySlots = document.querySelectorAll('.empty-slot');
            let allFilled = true;
            emptySlots.forEach(slot => {
                if(slot.querySelectorAll('.drag-wrapper').length === 0) allFilled = false;
            });

            if(allFilled) {
                let isCorrect = true;
                emptySlots.forEach(slot => {
                    const expected = parseInt(slot.dataset.expected);
                    const actualItem = slot.querySelector('.drag-item');
                    if (actualItem && parseInt(actualItem.dataset.val) !== expected) isCorrect = false;
                });

                if(isCorrect) {
                    showFeedback(true);
                } else {
                    handleMistake();
                    sortableInstances.forEach(s => s.option("disabled", true));
                    
                    emptySlots.forEach(slot => {
                        const expected = parseInt(slot.dataset.expected);
                        const actualWrapper = slot.querySelector('.drag-wrapper');
                        const actualItem = slot.querySelector('.drag-item');
                        
                        if(actualItem && parseInt(actualItem.dataset.val) !== expected) {
                            actualItem.classList.add('shake-animation');
                            setTimeout(() => {
                                actualItem.classList.remove('shake-animation');
                                document.getElementById('drag-pool').appendChild(actualWrapper);
                            }, 800);
                        }
                    });

                    setTimeout(() => {
                        sortableInstances.forEach(s => s.option("disabled", false));
                    }, 900);
                }
            }
        }

        // ========== 第二關：選擇題 ==========
        function generateLevel2() {
            document.getElementById('mcq-container').classList.remove('hidden');
            
            const times = uniqueLevel2Multipliers[currentQuestionIdx - 3];
            const ans = times * 25;
            currentCorrectAnswer = ans;

            document.getElementById('question-text').innerHTML = `👽 外星人需要能量！<br><span class="text-red-600 font-black">${times} 個 25</span> 是多少？`;
            document.getElementById('hint-text').innerHTML = `💡 小秘密：<br>你可以每 2 個 25 湊成 50，<br>或者 <strong class="text-red-600 text-xl md:text-2xl">每 4 個 25 湊成 100</strong> 來數數看喔！`;

            let options = [ans, ans + 25, ans - 25, ans + 50];
            if(ans - 25 <= 0) options[2] = ans + 75; 
            
            renderMCQ(options);
        }

        // ========== 第三關：複合選擇題 ==========
        function generateLevel3() {
            document.getElementById('mcq-container').classList.remove('hidden');
            
            const combo = uniqueLevel3Combos[currentQuestionIdx - 6];
            const A = combo.a;
            const B = combo.b;

            const ans = (2 * A) + B;
            currentCorrectAnswer = ans;

            document.getElementById('question-text').innerHTML = `🔒 寶箱密碼鎖：<br><span class="text-red-600 font-black">2 個 ${A} 多 ${B}</span> 是多少？`;
            document.getElementById('hint-text').innerHTML = `💡 小秘密：<br>2 個 ${A} 先加起來是 ${2*A}，<br>那 ${2*A} 再多 ${B} 會是多少呢？`;

            let options = [ans, ans + 10, (2 * A) - B > 0 ? (2 * A) - B : ans + 20, A + B];
            options = [...new Set(options)];
            while(options.length < 4) options.push(options[options.length-1] + 5);

            renderMCQ(options);
        }

        function renderMCQ(optionsArray) {
            optionsArray = shuffleArray(optionsArray);
            const container = document.getElementById('mcq-container');
            container.innerHTML = '';
            
            optionsArray.forEach(opt => {
                const btn = document.createElement('button');
                // 按鈕高度稍微調整，避免 iPad 佔據太多版面 (py-4 md:py-6)
                btn.className = 'game-btn bg-yellow-400 hover:bg-yellow-300 text-yellow-900 text-4xl md:text-5xl font-black py-4 md:py-6 rounded-3xl border-4 border-yellow-200 shadow-xl';
                btn.innerText = opt;
                btn.onclick = () => checkMCQAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function checkMCQAnswer(selected, btnElement) {
            if (selected === currentCorrectAnswer) {
                showFeedback(true);
            } else {
                handleMistake();
                btnElement.classList.remove('bg-yellow-400', 'hover:bg-yellow-300', 'border-yellow-200', 'text-yellow-900');
                btnElement.classList.add('shake-animation');
                
                setTimeout(() => {
                    btnElement.classList.remove('shake-animation');
                    btnElement.classList.add('bg-gray-400', 'text-gray-200', 'border-gray-500');
                    btnElement.disabled = true;
                }, 500);
            }
        }

        function handleMistake() {
            mistakes++;
            mistakesOnCurrent++;
            showFeedback(false);

            if (mistakesOnCurrent === 2) {
                setTimeout(() => {
                    const hintBox = document.getElementById('hint-box');
                    if(hintBox.classList.contains('hidden')) {
                        toggleHint(); 
                    }
                }, 1000);
            }
        }

        function toggleHint() {
            const hintBox = document.getElementById('hint-box');
            if (hintBox.classList.contains('hidden')) {
                hintBox.classList.remove('hidden');
                hintsUsed++; 
                // 若開啟提示導致畫面變長，自動滑到底部確保按鈕可見
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);
            } else {
                hintBox.classList.add('hidden');
            }
        }

        function hideHint() {
            document.getElementById('hint-box').classList.add('hidden');
        }

        function showFeedback(isCorrect) {
            if (isCorrect) {
                const overlay = document.getElementById('success-overlay');
                const msgBox = document.getElementById('success-message');
                
                overlay.classList.remove('hidden');
                setTimeout(() => { msgBox.classList.remove('scale-0'); msgBox.classList.add('scale-100'); }, 10);
                
                confetti({
                    particleCount: 120, spread: 80, origin: { y: 0.6 },
                    colors: ['#fce7f3', '#fcd34d', '#86efac', '#93c5fd']
                });

                setTimeout(() => {
                    overlay.classList.add('hidden');
                    msgBox.classList.remove('scale-100');
                    msgBox.classList.add('scale-0');
                    currentQuestionIdx++;
                    loadNextQuestion();
                }, 1500);

            } else {
                const errorToast = document.getElementById('error-toast');
                errorToast.classList.remove('-translate-y-24', 'opacity-0');
                errorToast.classList.add('translate-y-0', 'opacity-100');
                
                setTimeout(() => {
                    errorToast.classList.remove('translate-y-0', 'opacity-100');
                    errorToast.classList.add('-translate-y-24', 'opacity-0');
                }, 1500);
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('game-screen').classList.add('hidden');
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');
            window.scrollTo(0, 0);

            let m = Math.floor(timeElapsed / 60);
            let s = timeElapsed % 60;
            document.getElementById('stat-time').innerText = `${m} 分 ${s} 秒`;
            document.getElementById('stat-mistakes').innerText = mistakes;
            document.getElementById('stat-hints').innerText = hintsUsed;

            const title = document.getElementById('result-title');
            const subtitle = document.getElementById('result-subtitle');
            const icon = document.getElementById('medal-icon');

            if (mistakes === 0 && timeElapsed <= GOLD_TIME_LIMIT) {
                title.innerText = "完美通關！";
                title.className = "text-5xl md:text-6xl font-black mb-2 text-yellow-300 drop-shadow-lg";
                subtitle.innerText = "數學小天才！拿到金星徽章！";
                icon.innerText = "🥇";
                triggerBigConfetti();
            } else if (mistakes <= 1 && timeElapsed <= SILVER_TIME_LIMIT) {
                title.innerText = "優秀通關！";
                title.className = "text-5xl md:text-6xl font-black mb-2 text-gray-200 drop-shadow-lg";
                subtitle.innerText = "太棒了！拿到銀星徽章！";
                icon.innerText = "🥈";
                triggerBigConfetti();
            } else {
                title.innerText = "完成挑戰！";
                title.className = "text-5xl md:text-6xl font-black mb-2 text-orange-400 drop-shadow-lg";
                subtitle.innerText = "很棒的嘗試！再挑戰一次拿金牌吧！";
                icon.innerText = "🥉";
            }
        }

        function triggerBigConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function resetGame() {
            startGame();
        }
    </script>
</body>
</html>
